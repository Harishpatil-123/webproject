<!DOCTYPE html>
<html>
<head>
<title>Flexbox Navigation Bar</title>
<style>
nav {
display: flex;
justify-content: center;
gap: 30px;
background-color: black;
padding: 15px;
}
nav a {
color: white;
text-decoration: none;
font-size: 18px;
}
nav a:hover {
color: yellow;
}
</style>
</head>
<body>

<nav>
<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Services</a>
<a href="#">Contact</a>
</nav>
</body>
</html>
